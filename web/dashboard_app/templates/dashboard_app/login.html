{% extends "dashboard_app/base.html" %}


{% block title %}
Login | Pi Security
{% endblock %}


{% block content %}

<section class="card login-card">

    <h2>Pi Security Login</h2>

    {% if form.errors %}

    <p class="error">
        Invalid username or password.
    </p>

    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Log In
        </button>

    </form>

</section>

{% endblock %}
